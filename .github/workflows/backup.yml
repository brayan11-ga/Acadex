
name: Respaldo diario Acadex

on:
  schedule:
    - cron: "0 7 * * *" # 02:00 Colombia
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: acadex-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Instalar PostgreSQL 17 y rclone
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 rclone

      - name: Preparar carpeta de respaldo
        run: |
          FECHA=$(date -u +%Y-%m-%d_%H%M%S)
          CARPETA="acadex_${FECHA}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"

          mkdir -p "$CARPETA/acadex-adjuntos"

          echo "CARPETA=$CARPETA" >> "$GITHUB_ENV"

      - name: Generar backup PostgreSQL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --schema=public \
            --no-owner \
            --no-privileges \
            --file="$CARPETA/acadex.dump"

          test -s "$CARPETA/acadex.dump"

          /usr/lib/postgresql/17/bin/pg_restore \
            --file=/dev/null "$CARPETA/acadex.dump"

      - name: Generar backup Supabase Storage
        env:
          RCLONE_CONFIG_ACADEX_TYPE: s3
          RCLONE_CONFIG_ACADEX_PROVIDER: Other
          RCLONE_CONFIG_ACADEX_ENV_AUTH: "false"
          RCLONE_CONFIG_ACADEX_FORCE_PATH_STYLE: "true"
          RCLONE_CONFIG_ACADEX_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          RCLONE_CONFIG_ACADEX_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          RCLONE_CONFIG_ACADEX_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_ACADEX_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          rclone copy \
            acadex:acadex-adjuntos \
            "$CARPETA/acadex-adjuntos" \
            --progress

          rclone check \
            acadex:acadex-adjuntos \
            "$CARPETA/acadex-adjuntos" \
            --download

          rclone size "$CARPETA/acadex-adjuntos"

      - name: Generar huellas SHA256
        run: |
          cd "$CARPETA"

          sha256sum acadex.dump > sha256.txt

          find acadex-adjuntos -type f \
            -exec sha256sum {} + >> sha256.txt

          sha256sum -c sha256.txt

      - name: Subir respaldo completo a Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          DESTINO="s3://${R2_BUCKET}/backups/${CARPETA}"

          aws s3 cp "$CARPETA/" "$DESTINO/" \
            --recursive \
            --endpoint-url "$ENDPOINT"

          printf 'Respaldo cargado: %s\n' "$(date -u +%FT%TZ)" | \
            aws s3 cp - "$DESTINO/_SUCCESS" \
            --endpoint-url "$ENDPOINT"

          echo "Respaldo cargado correctamente"
